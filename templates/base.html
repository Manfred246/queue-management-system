{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система управления очередью{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="container site-header">
        <a href="{% url 'homepage:index' %}">
            <img src="{% static 'homepage/img/logo.svg' %}"
                 alt="Система управления очередью" class="site-logo">
        </a>
    </header>
    {% include "includes/navigation.html" %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer">
        © <span id="current-year"></span> Система управления очередью
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
